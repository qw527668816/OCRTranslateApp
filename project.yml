name: OCRTranslate
options:
  bundleIdPrefix: com.limaoswag
  deploymentTarget:
    iOS: "15.0"
  developmentLanguage: zh-Hans

settings:
  base:
    ALWAYS_SEARCH_USER_PATHS: false
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    IPHONEOS_DEPLOYMENT_TARGET: "15.0"
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGN_IDENTITY: ""
    DEVELOPMENT_TEAM: ""
    MARKETING_VERSION: "1.2.0"
    CURRENT_PROJECT_VERSION: "4"

targets:
  OCRTranslate:
    type: application
    platform: iOS
    sources:
      - path: OCRTranslate/App
      - path: OCRTranslate/Views
      - path: OCRTranslate/Resources
      - path: Shared
    info:
      path: OCRTranslate/Info.plist
      properties:
        CFBundleShortVersionString: "1.2.0"
        CFBundleVersion: "4"
        CFBundleDisplayName: "OCR屏幕翻译"
        CFBundleIconName: "AppIcon"
        CFBundleIcons:
          CFBundlePrimaryIcon:
            CFBundleIconFiles:
              - AppIcon60x60
            CFBundleIconName: "AppIcon"
        CFBundleIcons~ipad:
          CFBundlePrimaryIcon:
            CFBundleIconFiles:
              - AppIcon60x60
              - AppIcon76x76~ipad
            CFBundleIconName: "AppIcon"
        UIBackgroundModes:
          - audio
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        NSCameraUsageDescription: "需要使用相机拍照识别文字并翻译"
        NSPhotoLibraryUsageDescription: "需要访问相册选取图片进行文字识别和翻译"
        ITSAppUsesNonExemptEncryption: false
    entitlements:
      path: OCRTranslate/OCRTranslate.entitlements
    settings:
      base:
        PRODUCT_NAME: "$(TARGET_NAME)"
        PRODUCT_BUNDLE_IDENTIFIER: com.limaoswag.ocrtranslate
        CODE_SIGN_STYLE: Manual
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGN_IDENTITY: ""
        DEVELOPMENT_TEAM: ""
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        MARKETING_VERSION: "1.2.0"
        CURRENT_PROJECT_VERSION: "4"

# 录屏扩展(ScreenTranslator)目标已暂时移除:无 App Group 证书环境下的轻量版。
# 恢复全功能版:把 .github/workflows/build.yml 的 ldid/Package 步骤保留即可,
# 并从 git 历史恢复本文件的 ScreenTranslator target 与 dependencies 配置,
# 再把两个 .entitlements 换回带 App Group 的版本(见 git 历史)。

